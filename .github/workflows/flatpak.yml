name: Flatpak

# The Flathub build (apps/desktop/flatpak): built from source in Flathub's own container, checked with Flathub's
# linter, then installed and started with the smoke test, which inside Flatpak also runs a command on the computer and
# checks that one ignoring signals is stopped. Slow (llama.cpp and stable-diffusion.cpp are compiled), so it runs when
# the Flatpak's own files change, for desktop releases, and by hand.

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['desktop-v*']
    paths:
      - apps/desktop/flatpak/**
      - apps/desktop/src/flatpak.js
      - .github/workflows/flatpak.yml
  pull_request:
    paths:
      - apps/desktop/flatpak/**
      - apps/desktop/src/flatpak.js
      - .github/workflows/flatpak.yml

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build and start the Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Write the npm sources
        run: |
          # The version pinned here: the container has an older one (on its PYTHONPATH) that fails on Electron 44.
          unset PYTHONPATH
          python3 -m venv /tmp/generator
          /tmp/generator/bin/pip install --quiet --ignore-installed "git+https://github.com/flatpak/flatpak-builder-tools.git@9d86d336a39b9af38b86f114b6ce5820fe260f91#subdirectory=node"
          /tmp/generator/bin/python3 -c 'import flatpak_node_generator as g, sys; print(g.__file__); sys.exit(not g.__file__.startswith("/tmp/generator/"))'
          FLATPAK_NODE_GENERATOR=/tmp/generator/bin/flatpak-node-generator bash apps/desktop/flatpak/sources.sh

      # Flatpak can't update the runtimes the container comes with where they are: overlayfs won't rename folders of
      # the image's own layer ("Invalid cross-device link"). Copied once into the writable layer, they update.
      - name: Let Flatpak update the container's runtimes
        run: |
          if [ -d /var/lib/flatpak ]; then
            cp -a /var/lib/flatpak /var/lib/flatpak.copy
            rm -rf /var/lib/flatpak
            mv /var/lib/flatpak.copy /var/lib/flatpak
          fi

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        id: build
        with:
          manifest-path: apps/desktop/flatpak/computer.quo.Quo.yml
          bundle: quo.flatpak
          # As Flathub's own build does: the listing's screenshots are copied into the build.
          mirror-screenshots-url: https://dl.flathub.org/media/
          cache-key: flatpak-builder-${{ hashFiles('apps/desktop/flatpak/computer.quo.Quo.yml', 'apps/desktop/engine.lock.json') }}

      - name: Check the listing and the build with Flathub's linter
        run: |
          flatpak install -y --noninteractive flathub org.flatpak.Builder
          lint() { flatpak run --command=flatpak-builder-lint org.flatpak.Builder "$@"; }
          lint appstream apps/desktop/flatpak/computer.quo.Quo.metainfo.xml
          lint repo repo

      # Also when the linter complains: whether the app starts is worth knowing either way. As an ordinary user, as
      # people run it (Electron won't start as root with its sandbox on). The container has no useradd or su, so the
      # user is written into /etc/passwd and Python drops to it. Ubuntu's kernel keeps ordinary users from making the
      # namespaces Flatpak's sandbox needs unless told otherwise (this runner is thrown away afterwards).
      - name: Start it (smoke test)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          flatpak install -y --noninteractive --system --bundle quo.flatpak
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo 'tester:x:1001:1001:tester:/var/lib/quo-smoke:/bin/sh' >> /etc/passwd
          echo 'tester:x:1001:' >> /etc/group
          install -d -o 1001 -g 1001 -m 700 /var/lib/quo-smoke /run/user/1001
          python3 - <<'PY'
          import os
          os.setgroups([])
          os.setgid(1001)
          os.setuid(1001)
          env = {'HOME': '/var/lib/quo-smoke', 'USER': 'tester', 'LOGNAME': 'tester', 'XDG_RUNTIME_DIR': '/run/user/1001', 'PATH': os.environ['PATH'], 'LANG': 'C.UTF-8'}
          os.chdir('/var/lib/quo-smoke')
          os.execvpe('dbus-run-session', ['dbus-run-session', '--', 'xvfb-run', '-a', 'flatpak', 'run', '--env=QUO_EXPECT_ENGINE=1', 'computer.quo.Quo', '--smoke'], env)
          PY
