name: Desktop release

# Builds Quo for macOS, Windows and Linux with electron-builder.
# Push a desktop-vX.Y.Z tag (matching apps/desktop/package.json) to upload the
# builds to a draft GitHub release; publish the draft to ship it.
# See apps/desktop/README.md.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to a draft GitHub release (otherwise the builds are attached to this run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}

env:
  PUBLISH_MODE: ${{ (github.event_name == 'push' || inputs.publish) && 'always' || 'never' }}

jobs:
  draft:
    name: Prepare draft release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Created once up front so the parallel builds upload to the same draft.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          tag="desktop-v$version"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version (expected $tag)."
            exit 1
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Quo $version" --notes "Quo desktop $version. Code signing policy: https://quo.computer/code-signing/"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: --mac
            engines: mac-arm64 mac-x64
          - os: windows-latest
            platform: --win
            engines: win-x64
          - os: ubuntu-latest
            platform: --linux
            engines: linux-x64 linux-arm64
    runs-on: ${{ matrix.os }}
    env:
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_POLICY_SLUG != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - name: Build the web app
        working-directory: apps/web
        run: |
          npm ci
          npm run build

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # llama.cpp's llama-server, pinned in engine.lock.json and checked against
      # its SHA-256; the app ships this exact build. (The only engine it ever
      # downloads is the optional CUDA build the person asks for, pinned in the
      # same file: src/engine/accelerators.js.)
      - name: Fetch the AI engine
        working-directory: apps/desktop
        shell: bash
        run: |
          npm run fetch:engine -- ${{ matrix.engines }}
          npm run check:engine -- --version

      - name: Build with electron-builder
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Updates check this publisher on Windows once installers are signed (SignPath Foundation's certificate).
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
        run: |
          # Signing is optional: missing secrets arrive as empty strings, which
          # electron-builder would treat as configured, so unset them.
          extra_args=()
          case "$RUNNER_OS" in
            macOS)
              unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
              if [ -z "$CSC_LINK" ]; then
                echo "::warning::CSC_LINK is not set: building an ad-hoc signed, unnotarized macOS app."
                unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
                export CSC_IDENTITY_AUTO_DISCOVERY=false
                # Ad-hoc signing keeps the arm64 slice launchable (Gatekeeper still warns).
                extra_args=(-c.mac.identity=-)
              elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
                # electron-builder expects a path to the .p8 key file.
                key_file="$RUNNER_TEMP/apple-api-key.p8"
                printf '%s\n' "$APPLE_API_KEY" > "$key_file"
                export APPLE_API_KEY="$key_file"
              else
                echo "::warning::Apple API key secrets are not set: the app is signed but not notarized."
                unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
              fi
              ;;
            Windows)
              # electron-builder falls back to CSC_LINK on Windows; that's the Apple certificate.
              unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
              if [ "$SIGNPATH_ON" = true ]; then
                # Signed through SignPath Foundation (free for open source): only the app is built here, and the
                # installer is made from it once it's signed (the steps after this one).
                unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
                extra_args=(--dir)
                [ -z "$WIN_PUBLISHER_NAME" ] || extra_args+=("-c.win.publisherName=$WIN_PUBLISHER_NAME")
              elif [ -z "$WIN_CSC_LINK" ]; then
                echo "::warning::SignPath isn't set up (and no WIN_CSC_LINK): building an unsigned Windows installer."
                unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
              fi
              ;;
            *)
              unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
              ;;
          esac
          [ -n "$CSC_KEY_PASSWORD" ] || unset CSC_KEY_PASSWORD
          [ -n "$WIN_CSC_KEY_PASSWORD" ] || unset WIN_CSC_KEY_PASSWORD
          publish="$PUBLISH_MODE"
          [ "${extra_args[0]:-}" != --dir ] || publish=never  # the signed installer is published below
          npx electron-builder ${{ matrix.platform }} --publish "$publish" "${extra_args[@]}"

      # Windows, signed through SignPath Foundation: the app is signed, the installer is made from the signed app and
      # signed too (each request is approved by hand in SignPath), and latest.yml is made to match the signed installer.
      # SignPath's artifact configurations are named "app" (a zip of win-unpacked: sign Quo.exe) and "installer" (the .exe).
      - name: Upload the app for signing (Windows)
        id: upload-app
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quo-windows-app-unsigned
          path: apps/desktop/dist/win-unpacked
          retention-days: 1

      - name: Sign the app (SignPath Foundation)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/dist/win-signed

      - name: Build the installer from the signed app (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        working-directory: apps/desktop
        shell: bash
        run: |
          rm -rf dist/win-unpacked
          mv dist/win-signed dist/win-unpacked
          npx electron-builder --win nsis --prepackaged dist/win-unpacked --publish never

      - name: Upload the installer for signing (Windows)
        id: upload-installer
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quo-windows-installer-unsigned
          path: apps/desktop/dist/Quo-windows-x64-setup.exe
          archive: false
          retention-days: 1

      - name: Sign the installer (SignPath Foundation)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true
          output-artifact-directory: apps/desktop/dist/installer-signed

      - name: Publish the signed installer (Windows)
        if: runner.os == 'Windows' && env.SIGNPATH_ON == 'true'
        working-directory: apps/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/finish-signed-windows.js dist/installer-signed/Quo-windows-x64-setup.exe dist
          if [ "$PUBLISH_MODE" = always ]; then
            gh release upload "desktop-v$(node -p "require('./package.json').version")" dist/Quo-windows-x64-setup.exe dist/latest.yml --clobber
          fi

      - name: Upload builds to this run
        if: env.PUBLISH_MODE == 'never'
        uses: actions/upload-artifact@v7
        with:
          name: quo-desktop-${{ runner.os }}
          path: |
            apps/desktop/dist/Quo-*
            apps/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14
