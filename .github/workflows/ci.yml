name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # What Jest can't see: does Metro resolve every import, and does Hermes accept the result?
      - run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/export"
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  # Nothing sensitive reaches the public repository (secrets files, keys, tokens, personal
  # email addresses and local paths, in the files and in every commit ever made), and no
  # source file grows past 500 lines.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-secrets.js --history
      - run: node scripts/check-structure.js
      - run: node --test scripts/check-secrets.test.js scripts/check-structure.test.js

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      # Quo Sync's engine is one set of files in two apps; they must not drift apart.
      - run: node ../../scripts/check-shared-sync.js
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Quo Sync between the web app and the phone app, against the real server code:
  # the phone's own sync code (apps/mobile/services/sync) talking to the web's.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      # Only the phone app's plain JavaScript dependencies are needed, not its native build.
      - run: npm ci --ignore-scripts
        working-directory: apps/mobile
      - run: npm ci
        working-directory: apps/web
      - run: npm run test:interop
        working-directory: apps/web

  # The desktop app's engine code, and proof that the pinned llama.cpp build
  # downloads, verifies and starts on every platform we ship it for.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run fetch:engine
      - run: npm run check:engine -- --version
