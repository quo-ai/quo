# Quo on its own server: the website (quo.computer) and Quo Web with its API (app.quo.computer: Node on 127.0.0.1:3000).
# Cloudflare is in front (proxied DNS) and connects here on 443. deploy.ps1 copies this file to C:/quo/apache.conf, which
# httpd.conf includes (setup.ps1). Certificate: Let's Encrypt's, in C:/quo/tls, renewed by win-acme (README). Nothing here changes the server's other sites.
# Logs (they hold visitors' addresses) go to C:/quo/logs, one file a day, the last 14 kept (as the privacy policy says).

<IfModule !remoteip_module>
  LoadModule remoteip_module modules/mod_remoteip.so
</IfModule>

# Let's Encrypt's checks (win-acme writes them here), answered on every Quo address, on 80 and 443: Cloudflare may send
# the check to HTTPS first.
<Directory "C:/quo/acme/.well-known/acme-challenge">
  Options None
  AllowOverride None
  Require all granted
</Directory>

# Port 80: certificate checks, everything else to HTTPS.
<VirtualHost *:80>
  ServerName quo.computer
  ServerAlias www.quo.computer app.quo.computer
  Alias /.well-known/acme-challenge/ "C:/quo/acme/.well-known/acme-challenge/"
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^/(.*)$ https://%{HTTP_HOST}/$1 [R=301,L,NE]
</VirtualHost>

# The website: static files, as on Vercel (website/vercel.json): folders for pages, 404.html, the same headers.
<VirtualHost *:443>
  ServerName quo.computer
  ServerAlias www.quo.computer
  SSLEngine on
  SSLCertificateFile "C:/quo/tls/quo.computer-chain.pem"
  SSLCertificateKeyFile "C:/quo/tls/quo.computer-key.pem"
  # Let's Encrypt has no OCSP responder any more: nothing to staple.
  SSLUseStapling Off
  Alias /.well-known/acme-challenge/ "C:/quo/acme/.well-known/acme-challenge/"
  RewriteEngine On
  RewriteCond %{HTTP_HOST} ^www\. [NC]
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^/(.*)$ https://quo.computer/$1 [R=301,L,NE]
  # One address per page: /index.html and /privacy/index.html go to / and /privacy/ (only when asked for by name, not
  # when Apache looks up the folder's index itself).
  RewriteCond %{THE_REQUEST} \s/(([^?\s]*/)?)index\.html[\s?]
  RewriteRule ^ /%1 [R=301,L]
  DocumentRoot "C:/quo/site"
  <Directory "C:/quo/site">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
  </Directory>
  ErrorDocument 404 /404.html
  Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()"
  Header always set Strict-Transport-Security "max-age=31536000"
  <LocationMatch "^/assets/(shots|brand|fonts)/">
    Header set Cache-Control "public, max-age=604800"
  </LocationMatch>
  ErrorLog "|bin/rotatelogs.exe -n 14 C:/quo/logs/quo.computer-error.log 86400"
  CustomLog "|bin/rotatelogs.exe -n 14 C:/quo/logs/quo.computer-access.log 86400" combined
</VirtualHost>

# Quo Web and its API. The Node server sets the app's own headers (cross-origin isolation, caching).
<VirtualHost *:443>
  ServerName app.quo.computer
  SSLEngine on
  SSLCertificateFile "C:/quo/tls/quo.computer-chain.pem"
  SSLCertificateKeyFile "C:/quo/tls/quo.computer-key.pem"
  # Let's Encrypt has no OCSP responder any more: nothing to staple.
  SSLUseStapling Off

  # The visitor's address, taken from Cloudflare's header only when the connection comes from Cloudflare (free-tier
  # limits count by address). Whatever X-Forwarded-For the visitor sent is dropped; the proxy then sets it to that address.
  # Ranges: https://www.cloudflare.com/ips (checked 2 Nov 2026).
  RemoteIPHeader CF-Connecting-IP
  RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
  RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
  RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
  RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32
  RequestHeader unset X-Forwarded-For early

  ProxyRequests Off
  ProxyPreserveHost On
  RequestHeader set X-Forwarded-Proto "https"
  # Replies stream (server-sent events): pass each piece on at once, never compressed or held back.
  SetEnvIf Request_URI "^/api/" no-gzip=1
  ProxyTimeout 300
  Alias /.well-known/acme-challenge/ "C:/quo/acme/.well-known/acme-challenge/"
  ProxyPass /.well-known/acme-challenge/ !
  ProxyPass / http://127.0.0.1:3000/ flushpackets=on timeout=300 retry=0
  ProxyPassReverse / http://127.0.0.1:3000/
  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  ErrorLog "|bin/rotatelogs.exe -n 14 C:/quo/logs/app.quo.computer-error.log 86400"
  CustomLog "|bin/rotatelogs.exe -n 14 C:/quo/logs/app.quo.computer-access.log 86400" combined
</VirtualHost>
