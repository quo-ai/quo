<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Checkout — Quo</title>
<meta name="theme-color" content="#3b2eff" />
<link rel="icon" href="/favicon.png" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5fb; color: #0e0e1a;
    font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { text-align: center; padding: 24px; }
  h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: #54546a; margin: 0 0 18px; }
  a { color: #3b2eff; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<!-- Paddle's default payment link page. Kept outside the app's cross-origin
     isolation so Paddle.js can open its checkout (?_ptxn=transaction id). -->
<main>
  <h1>Opening secure checkout…</h1>
  <p id="status">Payments are handled by Paddle, our reseller.</p>
  <a href="/">Back to Quo</a>
</main>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
  (async () => {
    const status = document.getElementById('status');
    try {
      const config = await fetch('/api/billing/config').then(r => r.json());
      if (!config.paddle || !window.Paddle) throw new Error('unavailable');
      if (config.paddle.sandbox) Paddle.Environment.set('sandbox');
      Paddle.Initialize({
        token: config.paddle.clientToken,
        eventCallback(event) {
          if (event.name === 'checkout.completed') location.href = '/?checkout=success';
          if (event.name === 'checkout.closed') location.href = '/?checkout=cancelled';
        },
      });
    } catch {
      status.textContent = 'Checkout isn’t available right now. Please try again later.';
    }
  })();
</script>
</body>
</html>
